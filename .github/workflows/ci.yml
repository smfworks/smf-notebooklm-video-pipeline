name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax + helper tests
        run: bash tests/test_lib.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Local explainer unit tests
        run: python3 tests/test_local_explainer.py
